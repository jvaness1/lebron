# Candidate: cross-sectional momentum portfolio. The only strategy in the search
# with a robust OOS edge net of costs (scripts/xsmom.py): long-short Sharpe ~1.3,
# +143% OOS while the market fell -32% (survivorship-mitigated). Rebalances weekly
# (~10 position changes/week, not intraday — intraday + edge is killed by taker
# fees). position_size_r scales return AND drawdown: 0.3 → ~15% maxDD in backtest.
# allow_short: true is the validated edge but needs PERPETUAL FUTURES to trade for
# real; in paper it is simulated. Set false for a spot-only (long top-K) variant.
version: '03'
entry:
  indicator: xsmom
  lookback_days: 30
  skip_days: 0
  top_k: 5
  allow_short: true
  # Regime gate (added v02, validated P0): only hold the book when the market is
  # broadly bullish, else sit in CASH. OOS lifted Sharpe ~0.3->1.6, maxDD ~48%->9%,
  # robust across thresholds. A coin counts bullish if its daily bull_score >= 6.
  regime_gate: true
  breadth_threshold: 0.4
  breadth_bull_min: 6
rebalance_days: 7
position_size_r: 0.3
costs:
  fees_bps: 10.0
  slippage_bps: 5.0
risk:
  max_drawdown_halt: 0.20   # circuit breaker: flatten to cash + halt if equity falls
                            # 20% below its high-water mark (strategy DD is ~4-11%, so
                            # this only trips if something is genuinely broken)
universe:
  - BTC/USDT
  - ETH/USDT
  - SOL/USDT
  - XRP/USDT
  - ADA/USDT
  - DOGE/USDT
  - AVAX/USDT
  - LINK/USDT
  - DOT/USDT
  - LTC/USDT
  - BCH/USDT
  - TRX/USDT
  - ATOM/USDT
  - NEAR/USDT
  - APT/USDT
  - ARB/USDT
  - OP/USDT
  - INJ/USDT
  - SUI/USDT
  - FIL/USDT
  - ETC/USDT
  - XLM/USDT
  - AAVE/USDT
  - UNI/USDT
