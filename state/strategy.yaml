# LIVE strategy (v06): LONG-ONLY dual momentum on an EXPANDED, COINBASE-TRADEABLE universe.
# Changes from v05: (1) universe expanded 24 -> 36 coins — more breadth robustly improves
# cross-sectional selection (beats the old set in 4/5 walk-forward slices, Sharpe up);
# (2) every coin is listed on Coinbase (US-tradeable) — TRX and BNB removed (not Coinbase-US),
# illiquid memecoins excluded for slippage safety.
#
# Signal: multi-horizon momentum (avg of 14/30/60d returns) -> top 5; hold only those also
# above their 100d MA (dual momentum), else cash. Weekly rebalance. ~halves drawdown vs
# plain long-only. Backtest-validated; live forward-proof still pending.
#
# PAPER bot fetches these as <COIN>/USDT from KuCoin (EXCHANGE_ID=kucoin). To trade REAL on
# Coinbase: set EXCHANGE_ID=coinbase, switch pairs to <COIN>/USD, and verify each coin is
# actually enabled in YOUR Coinbase account before going live.
