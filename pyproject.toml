[project]
name = "hermes-trading"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "ccxt>=4.3.56",
    "yfinance>=0.2.40",
    "pyyaml>=6.0.2",
    "httpx>=0.27.2",
    "aiofiles>=24.1.0",
    "numpy>=1.26.4",
    "pandas>=2.2.3",
    "rich>=13.9.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
